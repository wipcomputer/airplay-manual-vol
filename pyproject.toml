[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallvol"
version = "0.1.0"
description = "A Decora wall panel for the whole house: per-speaker volume for AirPlay speakers (Sonos, HomePod, Syng) plus Matter plugs and dimmers, HUUM saunas and Traeger grills, with a live web prototype"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "WIP Computer, Inc." }]
dependencies = [
  "pyatv==0.18.0",  # the HomePod driver patches pyatv internals; bump deliberately
  "soco>=0.31",
  "aiohttp>=3.9",
  "zeroconf>=0.130",
  "paho-mqtt>=2.1",   # Traeger status stream
]

[project.scripts]
wallvol = "wallvol.cli:main"

[tool.setuptools.packages.find]
include = ["wallvol*"]

[tool.setuptools.package-data]
wallvol = ["web/*"]
